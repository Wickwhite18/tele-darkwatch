[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tele-darkwatch"
version = "0.4.0"
description = "Telegram and dark-web monitoring and search project with collectors, storage, and alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "socksio>=1.0",   # SOCKS5 proxy support for Tor in httpx
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
darkwatch = "tele_darkwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
